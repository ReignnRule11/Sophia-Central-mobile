name: Push Mobile App Updates

on:
  workflow_dispatch:

jobs:
  push-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Create/update prepared mobile files
        run: |
          # Create directories
          mkdir -p src/screens src/api src/config src/utils src/__tests__ .github/workflows backend_examples

          # Upload config
          cat > src/config/uploadConfig.ts <<'EOF'
          export const UPLOAD_CONFIG = {
            CHUNK_SIZE: 5 * 1024 * 1024, // 5 MB
            MULTIPART_THRESHOLD: 10 * 1024 * 1024, // 10 MB
            MAX_UPLOAD_ATTEMPTS: 3,
            MAX_CONFIRM_ATTEMPTS: 3,
            BACKOFF_BASE_MS: 500,
          };
          EOF

          # Typed API wrapper
          cat > src/api/api.ts <<'EOF'
          import client from './client';

          export type ResourceCreateRequest = { title: string; description?: string; type?: string };
          export type ResourceCreateResponse = { id: string };
          export type PresignResponse = { uploadUrl: string; fileKey: string; expiresIn?: number; method?: string };
          export type InitiateMultipartResponse = { uploadId: string; fileKey: string; parts: { partNumber: number; uploadUrl: string }[]; };
          export type CompleteMultipartRequest = { uploadId: string; fileKey: string; parts: { partNumber: number; etag: string }[]; };

          export async function createResource(payload: ResourceCreateRequest): Promise<ResourceCreateResponse> {
            const resp = await client.post('/resources', payload);
            return resp.data;
          }

          export async function presignUrl(filename: string, mimeType: string, size: number): Promise<PresignResponse> {
            const resp = await client.post('/storage/presigned-url', { filename, mimeType, size });
            return resp.data;
          }

          export async function confirmUpload(fileKey: string, resourceId: string) {
            const resp = await client.post('/storage/confirm-upload', { fileKey, resourceId });
            return resp.data;
          }

          export async function initiateMultipart(filename: string, mimeType: string, size: number, chunkSize: number): Promise<InitiateMultipartResponse> {
            const resp = await client.post('/storage/initiate-multipart', { filename, mimeType, size, chunkSize });
            return resp.data;
          }

          export async function completeMultipart(req: CompleteMultipartRequest) {
            const resp = await client.post('/storage/complete-multipart', req);
            return resp.data;
          }

          export async function login(email: string, password: string) {
            const resp = await client.post('/auth/login', { email, password });
            return resp.data;
          }

          export async function refreshToken(refresh_token: string) {
            const resp = await client.post('/auth/refresh', { refresh_token });
            return resp.data;
          }
          EOF

          # chunk util
          cat > src/utils/chunk.ts <<'EOF'
          export function splitArrayBufferIntoChunks(buffer: ArrayBuffer, chunkSize: number): ArrayBuffer[] {
            const result: ArrayBuffer[] = [];
            let offset = 0;
            while (offset < buffer.byteLength) {
              const size = Math.min(chunkSize, buffer.byteLength - offset);
              const chunk = buffer.slice(offset, offset + size);
              result.push(chunk);
              offset += size;
            }
            return result;
          }
          EOF

          # UploadScreen (progress, cancel, multipart client)
          cat > src/screens/UploadScreen.tsx <<'EOF'
          import React, { useState, useRef } from 'react';
          import {
            View,
            Text,
            TextInput,
            Button,
            StyleSheet,
            ActivityIndicator,
            Alert,
            Platform,
            ProgressBarAndroid,
            ProgressViewIOS,
          } from 'react-native';
          import * as DocumentPicker from 'expo-document-picker';
          import * as FileSystem from 'expo-file-system';
          import { UPLOAD_CONFIG } from '../config/uploadConfig';
          import { createResource, presignUrl, confirmUpload, initiateMultipart, completeMultipart } from '../api/api';
          import { splitArrayBufferIntoChunks } from '../utils/chunk';

          type SelectedFile = { uri: string; name?: string; size?: number; mimeType?: string; };

          async function uploadBlobWithProgressXHR(uploadUrl: string, blob: Blob, mimeType: string, onProgress: (p: number) => void, signal?: { aborted: boolean; abort: () => void }) {
            return new Promise<void>((resolve, reject) => {
              const xhr = new XMLHttpRequest();
              xhr.open('PUT', uploadUrl);
              try { xhr.setRequestHeader('Content-Type', mimeType); } catch (e) {}
              xhr.onload = () => { if (xhr.status >= 200 && xhr.status < 300) resolve(); else reject(new Error(`Upload failed with status ${xhr.status}`)); };
              xhr.onerror = () => reject(new Error('Network error during upload'));
              if (xhr.upload && typeof xhr.upload.onprogress !== 'undefined') {
                xhr.upload.onprogress = (event: ProgressEvent) => {
                  if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    onProgress(percent);
                  }
                };
              }
              if (signal) {
                const origAbort = signal.abort;
                signal.abort = () => { try { xhr.abort(); } catch (e) {} ; origAbort(); };
              }
              xhr.send(blob as any);
            });
          }

          function sleep(ms: number) { return new Promise((res) => setTimeout(res, ms)); }

          export default function UploadScreen() {
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [selectedFile, setSelectedFile] = useState<SelectedFile | null>(null);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState(0);
            const abortRef = useRef<{ aborted: boolean; abort: () => void } | null>(null);

            const handlePickFile = async () => {
              try {
                const result = await DocumentPicker.getDocumentAsync({ copyToCacheDirectory: true });
                if (result.type === 'cancel') return;
                const fileInfo = await FileSystem.getInfoAsync(result.uri);
                setSelectedFile({ uri: result.uri, name: result.name, size: fileInfo.size, mimeType: result.mimeType || 'application/octet-stream' });
              } catch (e) { Alert.alert('File picker error'); console.log(e); }
            };

            const handleCancel = () => {
              if (abortRef.current) { abortRef.current.abort(); abortRef.current = null; setUploading(false); setProgress(0); Alert.alert('Upload cancelled'); }
            };

            const handleUpload = async () => {
              if (!title.trim()) { Alert.alert('Missing title'); return; }
              if (!selectedFile) { Alert.alert('No file'); return; }
              setUploading(true); setProgress(0);
              abortRef.current = { aborted: false, abort: () => { if (abortRef.current) abortRef.current.aborted = true; } };

              try {
                const resource = await createResource({ title, description, type: 'other' });
                const resourceId = resource.id;
                if (!resourceId) throw new Error('Resource id missing');

                const useMultipart = (selectedFile.size || 0) >= UPLOAD_CONFIG.MULTIPART_THRESHOLD;
                if (useMultipart) {
                  const init = await initiateMultipart(selectedFile.name || 'file', selectedFile.mimeType || 'application/octet-stream', selectedFile.size || 0, UPLOAD_CONFIG.CHUNK_SIZE);
                  const { uploadId, fileKey, parts } = init;
                  const fileData = await FileSystem.readAsStringAsync(selectedFile.uri, { encoding: FileSystem.EncodingType.Base64 });
                  const buffer = Uint8Array.from(atob(fileData), (c) => c.charCodeAt(0)).buffer;
                  const chunks = splitArrayBufferIntoChunks(buffer, UPLOAD_CONFIG.CHUNK_SIZE);
                  let uploadedBytes = 0;
                  const uploadedParts: { partNumber: number; etag: string }[] = [];

                  for (let i = 0; i < chunks.length; i++) {
                    if (abortRef.current?.aborted) throw new Error('Upload aborted');
                    const partNumber = i + 1;
                    const presigned = parts.find((p: any) => p.partNumber === partNumber);
                    if (!presigned) throw new Error(`Missing presigned URL for part ${partNumber}`);
                    const blob = new Blob([chunks[i]]);
                    let attempt = 0;
                    let uploaded = false;
                    while (!uploaded && attempt < UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) {
                      attempt += 1;
                      try {
                        await uploadBlobWithProgressXHR(presigned.uploadUrl, blob, selectedFile.mimeType || 'application/octet-stream', (percent) => {
                          const partProgress = (percent / 100) * chunks[i].byteLength;
                          const newPercent = Math.round(((uploadedBytes + partProgress) / (selectedFile.size || 1)) * 100);
                          setProgress(newPercent);
                        }, abortRef.current || undefined);
                        uploadedParts.push({ partNumber, etag: 'etag-placeholder' });
                        uploadedBytes += chunks[i].byteLength;
                        uploaded = true;
                      } catch (err) {
                        if (attempt >= UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) throw err;
                        await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, attempt));
                      }
                    }
                  }

                  await completeMultipart({ uploadId, fileKey, parts: uploadedParts });
                  await confirmUpload(fileKey, resourceId);
                } else {
                  const presign = await presignUrl(selectedFile.name || 'uploaded-file', selectedFile.mimeType || 'application/octet-stream', selectedFile.size || 0);
                  const { uploadUrl, fileKey } = presign;
                  const b64 = await FileSystem.readAsStringAsync(selectedFile.uri, { encoding: FileSystem.EncodingType.Base64 });
                  const buffer = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
                  const blob = new Blob([buffer.buffer]);
                  let attempt = 0;
                  let uploaded = false;
                  while (!uploaded && attempt < UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) {
                    attempt += 1;
                    try {
                      await uploadBlobWithProgressXHR(uploadUrl, blob, selectedFile.mimeType || 'application/octet-stream', setProgress, abortRef.current || undefined);
                      uploaded = true;
                    } catch (err) {
                      if (attempt >= UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) throw err;
                      await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, attempt));
                    }
                  }
                  let confirmAttempt = 0;
                  let confirmed = false;
                  while (!confirmed && confirmAttempt < UPLOAD_CONFIG.MAX_CONFIRM_ATTEMPTS) {
                    confirmAttempt += 1;
                    try { await confirmUpload(fileKey, resourceId); confirmed = true; } catch (err) {
                      if (confirmAttempt >= UPLOAD_CONFIG.MAX_CONFIRM_ATTEMPTS) throw err;
                      await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, confirmAttempt));
                    }
                  }
                }

                Alert.alert('Upload successful');
                setTitle(''); setDescription(''); setSelectedFile(null); setProgress(0);
              } catch (err) {
                console.log(err); Alert.alert('Upload failed');
              } finally {
                setUploading(false); abortRef.current = null;
              }
            };

            return (
              <View style={styles.container}>
                <Text style={styles.title}>Upload Resource</Text>
                <TextInput placeholder="Title" style={styles.input} value={title} onChangeText={setTitle} />
                <TextInput placeholder="Description" style={styles.input} value={description} multiline onChangeText={setDescription} />
                <Button title={selectedFile ? `Selected: ${selectedFile.name}` : 'Select File'} onPress={handlePickFile} />
                <View style={{ height: 12 }} />
                {Platform.OS === 'android' ? (uploading && <ProgressBarAndroid styleAttr="Horizontal" indeterminate={false} progress={progress/100} />) : (uploading && <ProgressViewIOS progress={progress/100} />)}
                <View style={{ height: 8 }} />
                <Button title={uploading ? `Uploading... ${progress}%` : 'Upload Resource'} onPress={handleUpload} disabled={uploading} />
                <View style={{ height: 8 }} />
                {uploading && <Button title="Cancel Upload" onPress={handleCancel} color="#d9534f" />}
                {uploading && <ActivityIndicator style={{ marginTop: 16 }} size="small" />}
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, padding: 12 },
            title: { fontSize: 22, fontWeight: '700', marginBottom: 12 },
            input: { borderWidth: 1, borderColor: '#ddd', padding: 12, marginBottom: 12, borderRadius: 6 },
          });
          EOF

      - name: Commit and push prepared changes
        env:
          GIT_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git config user.email "ci@yourteam"
          git config user.name "ci-bot"
          git remote set-url origin https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git
          git add .
          git commit -m "chore: add multipart upload client, progress UI and config" || echo "no changes to commit"
          git push origin HEAD:main
