name: Push Mobile App Updates

on:
  workflow_dispatch:

jobs:
  push-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create directories
        run: |
          mkdir -p src/config src/api src/utils src/screens src/__tests__ backend_examples

      - name: Write uploadConfig
        run: |
          cat > src/config/uploadConfig.ts <<'EOF'
          export const UPLOAD_CONFIG = {
            CHUNK_SIZE: 5 * 1024 * 1024, // 5 MB
            MULTIPART_THRESHOLD: 10 * 1024 * 1024, // 10 MB - use multipart when file > 10MB
            MAX_UPLOAD_ATTEMPTS: 3,
            MAX_CONFIRM_ATTEMPTS: 3,
            BACKOFF_BASE_MS: 500,
          };
          EOF

      - name: Write api client (client.ts)
        run: |
          cat > src/api/client.ts <<'EOF'
          import axios from 'axios';
          import * as SecureStore from 'expo-secure-store';
          import Constants from 'expo-constants';

          const API_URL = Constants.manifest?.extra?.apiUrl || process.env.API_URL || 'http://localhost:3000';
          const client = axios.create({ baseURL: API_URL, timeout: 30000, headers: { 'Content-Type': 'application/json' } });

          let isRefreshing = false;
          let failedQueue: Array<{ resolve: (token: string) => void; reject: (err: any) => void }> = [];

          const processQueue = (error: any, token: string | null = null) => {
            failedQueue.forEach((prom) => {
              if (error) prom.reject(error);
              else prom.resolve(token as string);
            });
            failedQueue = [];
          };

          client.interceptors.request.use(async (config) => {
            try {
              const token = await SecureStore.getItemAsync('auth_token');
              if (token && config.headers) config.headers.Authorization = `Bearer ${token}`;
            } catch (e) {}
            return config;
          });

          client.interceptors.response.use(
            (response) => response,
            async (error) => {
              const originalRequest = error?.config;

              if (error?.response?.status === 401 && !originalRequest?._retry) {
                if (originalRequest.url?.includes('/auth/refresh') || originalRequest.url?.includes('/auth/login')) {
                  await SecureStore.deleteItemAsync('auth_token');
                  await SecureStore.deleteItemAsync('refresh_token');
                  return Promise.reject(error);
                }

                if (isRefreshing) {
                  return new Promise((resolve, reject) => {
                    failedQueue.push({ resolve, reject });
                  })
                    .then((token) => {
                      if (originalRequest.headers) originalRequest.headers.Authorization = `Bearer ${token}`;
                      return client(originalRequest);
                    })
                    .catch((err) => Promise.reject(err));
                }

                originalRequest._retry = true;
                isRefreshing = true;

                try {
                  const refreshToken = await SecureStore.getItemAsync('refresh_token');
                  if (!refreshToken) throw new Error('No refresh token available');

                  const resp = await axios.post(`${API_URL}/auth/refresh`, { refresh_token: refreshToken });
                  const newToken = resp.data?.access_token;
                  const newRefresh = resp.data?.refresh_token;

                  if (!newToken) throw new Error('Refresh failed: no access token returned');

                  await SecureStore.setItemAsync('auth_token', newToken);
                  if (newRefresh) await SecureStore.setItemAsync('refresh_token', newRefresh);

                  processQueue(null, newToken);
                  if (originalRequest.headers) originalRequest.headers.Authorization = `Bearer ${newToken}`;
                  return client(originalRequest);
                } catch (err) {
                  processQueue(err, null);
                  await SecureStore.deleteItemAsync('auth_token');
                  await SecureStore.deleteItemAsync('refresh_token');
                  return Promise.reject(err);
                } finally {
                  isRefreshing = false;
                }
              }

              return Promise.reject(error);
            }
          );

          export default client;
          EOF

      - name: Write typed api wrapper (api.ts)
        run: |
          cat > src/api/api.ts <<'EOF'
          import client from './client';

          export type ResourceCreateRequest = {
            title: string;
            description?: string;
            type?: string;
          };

          export type ResourceCreateResponse = { id: string };

          export type PresignResponse = { uploadUrl: string; fileKey: string; expiresIn?: number; method?: string };

          export type InitiateMultipartResponse = {
            uploadId: string;
            fileKey: string;
            parts: { partNumber: number; uploadUrl: string }[];
          };

          export type CompleteMultipartRequest = {
            uploadId: string;
            fileKey: string;
            parts: { partNumber: number; etag: string }[];
          };

          export async function createResource(payload: ResourceCreateRequest): Promise<ResourceCreateResponse> {
            const resp = await client.post('/resources', payload);
            return resp.data;
          }

          export async function presignUrl(filename: string, mimeType: string, size: number): Promise<PresignResponse> {
            const resp = await client.post('/storage/presigned-url', { filename, mimeType, size });
            return resp.data;
          }

          export async function confirmUpload(fileKey: string, resourceId: string) {
            const resp = await client.post('/storage/confirm-upload', { fileKey, resourceId });
            return resp.data;
          }

          export async function initiateMultipart(filename: string, mimeType: string, size: number, chunkSize: number): Promise<InitiateMultipartResponse> {
            const resp = await client.post('/storage/initiate-multipart', { filename, mimeType, size, chunkSize });
            return resp.data;
          }

          export async function completeMultipart(req: CompleteMultipartRequest) {
            const resp = await client.post('/storage/complete-multipart', req);
            return resp.data;
          }

          export async function login(email: string, password: string) {
            const resp = await client.post('/auth/login', { email, password });
            return resp.data;
          }

          export async function refreshToken(refresh_token: string) {
            const resp = await client.post('/auth/refresh', { refresh_token });
            return resp.data;
          }
          EOF

      - name: Write chunk util
        run: |
          cat > src/utils/chunk.ts <<'EOF'
          export function splitArrayBufferIntoChunks(buffer: ArrayBuffer, chunkSize: number): ArrayBuffer[] {
            const result: ArrayBuffer[] = [];
            let offset = 0;
            while (offset < buffer.byteLength) {
              const size = Math.min(chunkSize, buffer.byteLength - offset);
              const chunk = buffer.slice(offset, offset + size);
              result.push(chunk);
              offset += size;
            }
            return result;
          }
          EOF

