name: Push Mobile App Updates

on:
  workflow_dispatch:

jobs:
  push-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Create app files if missing
        run: |
          mkdir -p src/screens src/api src/navigation src/components src/config src/utils src/__tests__
          
          cat > App.tsx <<'EOF'
          import React from 'react';
          import { NavigationContainer } from '@react-navigation/native';
          import AppNavigator from './src/navigation/AppNavigator';

          export default function App() {
            return (
              <NavigationContainer>
                <AppNavigator />
              </NavigationContainer>
            );
          }
          EOF

          cat > package.json <<'EOF'
          {
            "name": "sophia-central-mobile",
            "version": "0.1.0",
            "private": true,
            "main": "node_modules/expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo run:android",
              "ios": "expo run:ios",
              "web": "expo start --web",
              "lint": "eslint . --ext .ts,.tsx,.js,.jsx",
              "test": "jest --runInBand"
            },
            "dependencies": {
              "@react-navigation/bottom-tabs": "6.7.8",
              "@react-navigation/native": "6.1.7",
              "@react-navigation/native-stack": "6.9.12",
              "axios": "1.4.0",
              "expo": "48.0.0",
              "expo-document-picker": "~13.0.0",
              "expo-file-system": "~15.0.0",
              "expo-secure-store": "12.1.0",
              "react": "18.2.0",
              "react-native": "0.71.8",
              "react-native-gesture-handler": "2.9.0",
              "react-native-safe-area-context": "4.5.0",
              "react-native-screens": "3.20.0"
            },
            "devDependencies": {
              "@types/react": "18.0.28",
              "@types/react-native": "0.71.6",
              "jest": "29.7.0",
              "ts-jest": "29.1.0",
              "typescript": "5.1.3",
              "eslint": "8.41.0",
              "eslint-config-prettier": "8.8.0"
            }
          }
          EOF

          cat > app.json <<'EOF'
          {
            "expo": {
              "name": "Sophia Central",
              "slug": "sophia-central-mobile",
              "version": "0.1.0",
              "orientation": "portrait",
              "platforms": ["ios", "android", "web"],
              "extra": {
                "apiUrl": "https://api.sophia-central.com"
              }
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "jsx": "react-jsx",
              "strict": true,
              "moduleResolution": "node",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true
            },
            "exclude": ["node_modules", "babel.config.js", "metro.config.js", "jest.config.js"]
          }
          EOF

          cat > .env.example <<'EOF'
          API_URL=https://api.sophia-central.com
          APP_VERSION=0.1.0
          EOF

          cat > .gitignore <<'EOF'
          node_modules
          .expo
          .expo-shared
          npm-debug.log
          yarn-error.log
          .env
          EOF

          cat > README.md <<'EOF'
          # Sophia Central Mobile

          Expo + React Native app for Sophia Central.

          ## Run locally
          npm install
          npm run start
          EOF

          cat > jest.config.js <<'EOF'
          module.exports = {
            preset: 'ts-jest',
            testEnvironment: 'node',
            transform: {
              '^.+\\\\.tsx?$': 'ts-jest'
            },
            testMatch: ['**/__tests__/**/*.test.(ts|tsx|js)']
          };
          EOF

          cat > src/config/uploadConfig.ts <<'EOF'
          export const UPLOAD_CONFIG = {
            CHUNK_SIZE: 5 * 1024 * 1024,
            MULTIPART_THRESHOLD: 10 * 1024 * 1024,
            MAX_UPLOAD_ATTEMPTS: 3,
            MAX_CONFIRM_ATTEMPTS: 3,
            BACKOFF_BASE_MS: 500,
          };
          EOF

          cat > src/api/client.ts <<'EOF'
          import axios from 'axios';
          import * as SecureStore from 'expo-secure-store';
          import Constants from 'expo-constants';

          const API_URL = Constants.manifest?.extra?.apiUrl || process.env.API_URL || 'http://localhost:3000';
          const client = axios.create({ baseURL: API_URL, timeout: 30000, headers: { 'Content-Type': 'application/json' } });

          let isRefreshing = false;
          let failedQueue: Array<{ resolve: (token: string) => void; reject: (err: any) => void }> = [];

          const processQueue = (error: any, token: string | null = null) => {
            failedQueue.forEach((prom) => {
              if (error) prom.reject(error);
              else prom.resolve(token as string);
            });
            failedQueue = [];
          };

          client.interceptors.request.use(async (config) => {
            try {
              const token = await SecureStore.getItemAsync('auth_token');
              if (token && config.headers) config.headers.Authorization = `Bearer ${token}`;
            } catch (e) {}
            return config;
          });

          client.interceptors.response.use(
            (response) => response,
            async (error) => {
              const originalRequest = error?.config;

              if (error?.response?.status === 401 && !originalRequest?._retry) {
                if (originalRequest.url?.includes('/auth/refresh') || originalRequest.url?.includes('/auth/login')) {
                  await SecureStore.deleteItemAsync('auth_token');
                  await SecureStore.deleteItemAsync('refresh_token');
                  return Promise.reject(error);
                }

                if (isRefreshing) {
                  return new Promise((resolve, reject) => {
                    failedQueue.push({ resolve, reject });
                  })
                    .then((token) => {
                      if (originalRequest.headers) originalRequest.headers.Authorization = `Bearer ${token}`;
                      return client(originalRequest);
                    })
                    .catch((err) => Promise.reject(err));
                }

                originalRequest._retry = true;
                isRefreshing = true;

                try {
                  const refreshToken = await SecureStore.getItemAsync('refresh_token');
                  if (!refreshToken) throw new Error('No refresh token available');

                  const resp = await axios.post(`${API_URL}/auth/refresh`, { refresh_token: refreshToken });
                  const newToken = resp.data?.access_token;
                  const newRefresh = resp.data?.refresh_token;

                  if (!newToken) throw new Error('Refresh failed: no access token returned');

                  await SecureStore.setItemAsync('auth_token', newToken);
                  if (newRefresh) await SecureStore.setItemAsync('refresh_token', newRefresh);

                  processQueue(null, newToken);
                  if (originalRequest.headers) originalRequest.headers.Authorization = `Bearer ${newToken}`;
                  return client(originalRequest);
                } catch (err) {
                  processQueue(err, null);
                  await SecureStore.deleteItemAsync('auth_token');
                  await SecureStore.deleteItemAsync('refresh_token');
                  return Promise.reject(err);
                } finally {
                  isRefreshing = false;
                }
              }

              return Promise.reject(error);
            }
          );

          export default client;
          EOF

          cat > src/api/api.ts <<'EOF'
          import client from './client';

          export type ResourceCreateRequest = { title: string; description?: string; type?: string };
          export type ResourceCreateResponse = { id: string };
          export type PresignResponse = { uploadUrl: string; fileKey: string; expiresIn?: number; method?: string };
          export type InitiateMultipartResponse = { uploadId: string; fileKey: string; parts: { partNumber: number; uploadUrl: string }[]; };
          export type CompleteMultipartRequest = { uploadId: string; fileKey: string; parts: { partNumber: number; etag: string }[]; };

          export async function createResource(payload: ResourceCreateRequest): Promise<ResourceCreateResponse> {
            const resp = await client.post('/resources', payload);
            return resp.data;
          }

          export async function presignUrl(filename: string, mimeType: string, size: number): Promise<PresignResponse> {
            const resp = await client.post('/storage/presigned-url', { filename, mimeType, size });
            return resp.data;
          }

          export async function confirmUpload(fileKey: string, resourceId: string) {
            const resp = await client.post('/storage/confirm-upload', { fileKey, resourceId });
            return resp.data;
          }

          export async function initiateMultipart(filename: string, mimeType: string, size: number, chunkSize: number): Promise<InitiateMultipartResponse> {
            const resp = await client.post('/storage/initiate-multipart', { filename, mimeType, size, chunkSize });
            return resp.data;
          }

          export async function completeMultipart(req: CompleteMultipartRequest) {
            const resp = await client.post('/storage/complete-multipart', req);
            return resp.data;
          }

          export async function login(email: string, password: string) {
            const resp = await client.post('/auth/login', { email, password });
            return resp.data;
          }

          export async function refreshToken(refresh_token: string) {
            const resp = await client.post('/auth/refresh', { refresh_token });
            return resp.data;
          }
          EOF

          cat > src/utils/chunk.ts <<'EOF'
          export function splitArrayBufferIntoChunks(buffer: ArrayBuffer, chunkSize: number): ArrayBuffer[] {\n  const result: ArrayBuffer[] = [];\n  let offset = 0;\n  while (offset < buffer.byteLength) {\n    const size = Math.min(chunkSize, buffer.byteLength - offset);\n    const chunk = buffer.slice(offset, offset + size);\n    result.push(chunk);\n    offset += size;\n  }\n  return result;\n}\n          EOF

          cat > src/navigation/AppNavigator.tsx <<'EOF'\n          import React from 'react';\n          import { createNativeStackNavigator } from '@react-navigation/native-stack';\n          import { createBottomTabNavigator } from '@react-navigation/bottom-tabs';\n          import HomeScreen from '../screens/HomeScreen';\n          import SearchScreen from '../screens/SearchScreen';\n          import UploadScreen from '../screens/UploadScreen';\n          import ProfileScreen from '../screens/ProfileScreen';\n          import LoginScreen from '../screens/LoginScreen';\n          import RegisterScreen from '../screens/RegisterScreen';\n          import ResourceDetailScreen from '../screens/ResourceDetailScreen';\n\n          const Stack = createNativeStackNavigator();\n          const Tab = createBottomTabNavigator();\n\n          function MainTabs() {\n            return (\n              <Tab.Navigator>\n                <Tab.Screen name=\"Home\" component={HomeScreen} />\n                <Tab.Screen name=\"Search\" component={SearchScreen} />\n                <Tab.Screen name=\"Upload\" component={UploadScreen} />\n                <Tab.Screen name=\"Profile\" component={ProfileScreen} />\n              </Tab.Navigator>\n            );\n          }\n\n          export default function AppNavigator() {\n            return (\n              <Stack.Navigator initialRouteName=\"Login\">\n                <Stack.Screen name=\"Login\" component={LoginScreen} />\n                <Stack.Screen name=\"Register\" component={RegisterScreen} />\n                <Stack.Screen name=\"Main\" component={MainTabs} options={{ headerShown: false }} />\n                <Stack.Screen name=\"ResourceDetail\" component={ResourceDetailScreen} />\n              </Stack.Navigator>\n            );\n          }\n          EOF\n\n          cat > src/screens/LoginScreen.tsx <<'EOF'\n          import React, { useState } from 'react';\n          import { View, Text, TextInput, Button, StyleSheet } from 'react-native';\n          import * as SecureStore from 'expo-secure-store';\n          import client from '../api/client';\n\n          export default function LoginScreen({ navigation }: any) {\n            const [email, setEmail] = useState('');\n            const [password, setPassword] = useState('');\n            const [loading, setLoading] = useState(false);\n\n            const handleLogin = async () => {\n              setLoading(true);\n              try {\n                const resp = await client.post('/auth/login', { email, password });\n                const { access_token, refresh_token } = resp.data;\n                if (access_token) await SecureStore.setItemAsync('auth_token', access_token);\n                if (refresh_token) await SecureStore.setItemAsync('refresh_token', refresh_token);\n                navigation.reset({ index: 0, routes: [{ name: 'Main' }] });\n              } catch (err) {\n                console.log(err);\n                alert('Login failed');\n              } finally {\n                setLoading(false);\n              }\n            };\n\n            return (\n              <View style={styles.container}>\n                <Text style={styles.title}>Sophia Central</Text>\n                <TextInput placeholder=\"Email\" style={styles.input} value={email} onChangeText={setEmail} />\n                <TextInput placeholder=\"Password\" secureTextEntry style={styles.input} value={password} onChangeText={setPassword} />\n                <Button title={loading ? 'Signing in...' : 'Sign In'} onPress={handleLogin} disabled={loading} />\n                <View style={{ height: 12 }} />\n                <Button title=\"Register\" onPress={() => navigation.navigate('Register')} />\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({\n            container: { flex: 1, justifyContent: 'center', padding: 16 },\n            title: { fontSize: 28, fontWeight: '700', marginBottom: 24, textAlign: 'center' },\n            input: { borderWidth: 1, borderColor: '#ddd', padding: 12, marginBottom: 12, borderRadius: 6 },\n          });\n          EOF\n\n          cat > src/screens/RegisterScreen.tsx <<'EOF'\n          import React, { useState } from 'react';\n          import { View, TextInput, Button, StyleSheet, Text } from 'react-native';\n          import client from '../api/client';\n\n          export default function RegisterScreen({ navigation }: any) {\n            const [firstName, setFirstName] = useState('');\n            const [lastName, setLastName] = useState('');\n            const [email, setEmail] = useState('');\n            const [password, setPassword] = useState('');\n\n            const handleRegister = async () => {\n              try {\n                await client.post('/auth/register', { firstName, lastName, email, password });\n                alert('Registration successful. Please log in.');\n                navigation.goBack();\n              } catch (err) {\n                console.log(err);\n                alert('Registration failed');\n              }\n            };\n\n            return (\n              <View style={styles.container}>\n                <Text style={styles.title}>Create Account</Text>\n                <TextInput placeholder=\"First name\" style={styles.input} value={firstName} onChangeText={setFirstName} />\n                <TextInput placeholder=\"Last name\" style={styles.input} value={lastName} onChangeText={setLastName} />\n                <TextInput placeholder=\"Email\" style={styles.input} value={email} onChangeText={setEmail} />\n                <TextInput placeholder=\"Password\" secureTextEntry style={styles.input} value={password} onChangeText={setPassword} />\n                <Button title=\"Register\" onPress={handleRegister} />\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({\n            container: { flex: 1, justifyContent: 'center', padding: 16 },\n            title: { fontSize: 22, fontWeight: '600', marginBottom: 16, textAlign: 'center' },\n            input: { borderWidth: 1, borderColor: '#ddd', padding: 12, marginBottom: 12, borderRadius: 6 },\n          });\n          EOF\n\n          cat > src/components/ResourceCard.tsx <<'EOF'\n          import React from 'react';\n          import { TouchableOpacity, View, Text, StyleSheet } from 'react-native';\n\n          export default function ResourceCard({ resource, onPress }: any) {\n            return (\n              <TouchableOpacity style={styles.card} onPress={onPress}>\n                <View>\n                  <Text style={styles.title}>{resource.title}</Text>\n                  <Text style={styles.meta}>{resource.uploader?.firstName || ''} • {resource.type}</Text>\n                </View>\n              </TouchableOpacity>\n            );\n          }\n\n          const styles = StyleSheet.create({\n            card: { padding: 12, borderWidth: 1, borderColor: '#eee', borderRadius: 8, marginBottom: 8 },\n            title: { fontSize: 16, fontWeight: '600' },\n            meta: { color: '#666', marginTop: 6 },\n          });\n          EOF\n\n          cat > src/screens/HomeScreen.tsx <<'EOF'\n          import React, { useEffect, useState } from 'react';\n          import { View, FlatList, Text, StyleSheet, ActivityIndicator } from 'react-native';\n          import client from '../api/client';\n          import ResourceCard from '../components/ResourceCard';\n\n          export default function HomeScreen({ navigation }: any) {\n            const [resources, setResources] = useState<any[]>([]);\n            const [loading, setLoading] = useState(true);\n\n            useEffect(() => { fetchResources(); }, []);\n\n            const fetchResources = async () => {\n              try {\n                const resp = await client.get('/resources?limit=20&status=approved');\n                setResources(resp.data.data || resp.data);\n              } catch (err) {\n                console.log(err);\n              } finally {\n                setLoading(false);\n              }\n            };\n\n            if (loading) return <ActivityIndicator style={{ flex: 1 }} size=\"large\" />;\n\n            return (\n              <View style={styles.container}>\n                <FlatList data={resources} keyExtractor={(item) => item.id} renderItem={({ item }) => (\n                  <ResourceCard resource={item} onPress={() => navigation.navigate('ResourceDetail', { id: item.id })} />\n                )} />\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({ container: { flex: 1, padding: 12 } });\n          EOF\n\n          cat > src/screens/SearchScreen.tsx <<'EOF'\n          import React, { useState } from 'react';\n          import { View, TextInput, Button, StyleSheet, FlatList } from 'react-native';\n          import client from '../api/client';\n          import ResourceCard from '../components/ResourceCard';\n\n          export default function SearchScreen({ navigation }: any) {\n            const [query, setQuery] = useState('');\n            const [results, setResults] = useState<any[]>([]);\n\n            const doSearch = async () => {\n              try {\n                const resp = await client.get('/search', { params: { q: query, limit: 20 } });\n                setResults(resp.data.data || resp.data);\n              } catch (err) {\n                console.log(err);\n                alert('Search failed');\n              }\n            };\n\n            return (\n              <View style={styles.container}>\n                <TextInput placeholder=\"Search resources\" style={styles.input} value={query} onChangeText={setQuery} />\n                <Button title=\"Search\" onPress={doSearch} />\n                <FlatList data={results} keyExtractor={(item) => item.id} renderItem={({ item }) => (\n                  <ResourceCard resource={item} onPress={() => navigation.navigate('ResourceDetail', { id: item.id })} />\n                )} />\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({ container: { flex: 1, padding: 12 }, input: { borderWidth: 1, borderColor: '#ddd', padding: 12, marginBottom: 8, borderRadius: 6 } });\n          EOF\n\n          cat > src/screens/ResourceDetailScreen.tsx <<'EOF'\n          import React, { useEffect, useState } from 'react';\n          import { View, Text, StyleSheet, ActivityIndicator, Button, ScrollView } from 'react-native';\n          import client from '../api/client';\n\n          export default function ResourceDetailScreen({ route }: any) {\n            const { id } = route.params;\n            const [resource, setResource] = useState<any>(null);\n            const [loading, setLoading] = useState(true);\n\n            useEffect(() => { fetchDetail(); }, []);\n\n            const fetchDetail = async () => {\n              try {\n                const resp = await client.get(`/resources/${id}`);\n                setResource(resp.data);\n              } catch (err) {\n                console.log(err);\n              } finally {\n                setLoading(false);\n              }\n            };\n\n            if (loading) return <ActivityIndicator style={{ flex: 1 }} size=\"large\" />;\n            if (!resource) return <View style={styles.container}><Text>Resource not found</Text></View>;\n\n            return (\n              <ScrollView style={styles.container} contentContainerStyle={{ padding: 12 }}>\n                <Text style={styles.title}>{resource.title}</Text>\n                <Text style={styles.meta}>{resource.course?.title || ''} • Level {resource.level}</Text>\n                <Text style={styles.desc}>{resource.description}</Text>\n                <View style={{ height: 12 }} />\n                <Button title=\"Download / Open\" onPress={() => {}} />\n              </ScrollView>\n            );\n          }\n\n          const styles = StyleSheet.create({ container: { flex: 1 }, title: { fontSize: 20, fontWeight: '700' }, meta: { color: '#666', marginTop: 6 }, desc: { marginTop: 12, lineHeight: 20 } });\n          EOF\n\n          cat > src/screens/ProfileScreen.tsx <<'EOF'\n          import React, { useEffect, useState } from 'react';\n          import { View, Text, Button, StyleSheet } from 'react-native';\n          import * as SecureStore from 'expo-secure-store';\n          import client from '../api/client';\n\n          export default function ProfileScreen({ navigation }: any) {\n            const [profile, setProfile] = useState<any>(null);\n\n            useEffect(() => { fetchProfile(); }, []);\n\n            const fetchProfile = async () => {\n              try {\n                const resp = await client.get('/users/me');\n                setProfile(resp.data);\n              } catch (err) {\n                console.log(err);\n              }\n            };\n\n            const handleLogout = async () => {\n              await SecureStore.deleteItemAsync('auth_token');\n              await SecureStore.deleteItemAsync('refresh_token');\n              navigation.reset({ index: 0, routes: [{ name: 'Login' }] });\n            };\n\n            return (\n              <View style={styles.container}>\n                <Text style={styles.title}>{profile ? `${profile.firstName} ${profile.lastName}` : 'Profile'}</Text>\n                <Button title=\"Refresh\" onPress={fetchProfile} />\n                <View style={{ height: 12 }} />\n                <Button title=\"Logout\" onPress={handleLogout} />\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({ container: { flex: 1, padding: 12 }, title: { fontSize: 20, fontWeight: '700', marginBottom: 12 } });\n          EOF\n\n          cat > src/screens/UploadScreen.tsx <<'EOF'\n          import React, { useState, useRef } from 'react';\n          import {\n            View,\n            Text,\n            TextInput,\n            Button,\n            StyleSheet,\n            ActivityIndicator,\n            Alert,\n            ProgressBarAndroid,\n            Platform,\n            ProgressViewIOS,\n          } from 'react-native';\n          import * as DocumentPicker from 'expo-document-picker';\n          import * as FileSystem from 'expo-file-system';\n          import { UPLOAD_CONFIG } from '../config/uploadConfig';\n          import { createResource, presignUrl, confirmUpload, initiateMultipart, completeMultipart } from '../api/api';\n          import { splitArrayBufferIntoChunks } from '../utils/chunk';\n\n          type SelectedFile = {\n            uri: string;\n            name?: string;\n            size?: number;\n            mimeType?: string;\n          };\n\n          async function uploadBlobWithProgressXHR(uploadUrl: string, blob: Blob, mimeType: string, onProgress: (p: number) => void, signal?: { aborted: boolean; abort: () => void }) {\n            return new Promise<void>((resolve, reject) => {\n              const xhr = new XMLHttpRequest();\n              xhr.open('PUT', uploadUrl);\n              try { xhr.setRequestHeader('Content-Type', mimeType); } catch (e) {}\n              xhr.onload = () => {\n                if (xhr.status >= 200 && xhr.status < 300) resolve();\n                else reject(new Error(`Upload failed with status ${xhr.status}`));\n              };\n              xhr.onerror = () => reject(new Error('Network error during upload'));\n              if (xhr.upload && typeof xhr.upload.onprogress !== 'undefined') {\n                xhr.upload.onprogress = (event: ProgressEvent) => {\n                  if (event.lengthComputable) {\n                    const percent = Math.round((event.loaded / event.total) * 100);\n                    onProgress(percent);\n                  }\n                };\n              }\n              if (signal) {\n                const origAbort = signal.abort;\n                signal.abort = () => {\n                  try { xhr.abort(); } catch (e) {}\n                  origAbort();\n                };\n              }\n              xhr.send(blob as any);\n            });\n          }\n\n          function sleep(ms: number) { return new Promise((res) => setTimeout(res, ms)); }\n\n          export default function UploadScreen() {\n            const [title, setTitle] = useState('');\n            const [description, setDescription] = useState('');\n            const [selectedFile, setSelectedFile] = useState<SelectedFile | null>(null);\n            const [uploading, setUploading] = useState(false);\n            const [progress, setProgress] = useState(0);\n            const abortRef = useRef<{ aborted: boolean; abort: () => void } | null>(null);\n\n            const handlePickFile = async () => {\n              try {\n                const result = await DocumentPicker.getDocumentAsync({\n                  type: [\n                    'application/pdf',\n                    'application/msword',\n                    'application/vnd.openxmlformats-officedocument.wordprocessingml.document',\n                    'application/vnd.ms-powerpoint',\n                    'application/vnd.openxmlformats-officedocument.presentationml.presentation',\n                    'text/plain',\n                    'image/png',\n                    'image/jpeg',\n                  ],\n                  copyToCacheDirectory: true,\n                });\n\n                if (result.type === 'cancel') return;\n                const fileInfo = await FileSystem.getInfoAsync(result.uri);\n                const file = {\n                  uri: result.uri,\n                  name: result.name,\n                  size: fileInfo.size,\n                  mimeType: result.mimeType || 'application/octet-stream',\n                };\n                setSelectedFile(file);\n              } catch (error) {\n                Alert.alert('File picker error', 'Unable to choose a file right now.');\n                console.log(error);\n              }\n            };\n\n            const handleCancel = () => {\n              if (abortRef.current) {\n                abortRef.current.abort();\n                abortRef.current = null;\n                setUploading(false);\n                setProgress(0);\n                Alert.alert('Upload cancelled');\n              }\n            };\n\n            const handleUpload = async () => {\n              if (!title.trim()) {\n                Alert.alert('Missing title', 'Please add a title before uploading.');\n                return;\n              }\n              if (!selectedFile) {\n                Alert.alert('No file selected', 'Please select a file before uploading.');\n                return;\n              }\n\n              setUploading(true);\n              setProgress(0);\n              abortRef.current = { aborted: false, abort: () => { abortRef.current!.aborted = true; } };\n\n              try {\n                const resource = await createResource({ title, description, type: 'other' });\n                const resourceId = resource.id;\n                if (!resourceId) throw new Error('Resource creation did not return id');\n\n                const useMultipart = (selectedFile.size || 0) >= UPLOAD_CONFIG.MULTIPART_THRESHOLD;\n\n                if (useMultipart) {\n                  const init = await initiateMultipart(selectedFile.name || 'file', selectedFile.mimeType || 'application/octet-stream', selectedFile.size || 0, UPLOAD_CONFIG.CHUNK_SIZE);\n                  const { uploadId, fileKey, parts } = init;\n                  const fileData = await FileSystem.readAsStringAsync(selectedFile.uri, { encoding: FileSystem.EncodingType.Base64 });\n                  const buffer = Uint8Array.from(atob(fileData), (c) => c.charCodeAt(0)).buffer;\n                  const chunks = splitArrayBufferIntoChunks(buffer, UPLOAD_CONFIG.CHUNK_SIZE);\n                  let uploadedBytes = 0;\n                  const uploadedParts: { partNumber: number; etag: string }[] = [];\n\n                  for (let i = 0; i < chunks.length; i++) {\n                    if (abortRef.current?.aborted) throw new Error('Upload aborted');\n                    const partNumber = i + 1;\n                    const presigned = parts.find((p) => p.partNumber === partNumber);\n                    if (!presigned) throw new Error(`Missing presigned URL for part ${partNumber}`);\n\n                    const blob = new Blob([chunks[i]]);\n                    let attempt = 0;\n                    let uploaded = false;\n                    while (!uploaded && attempt < UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) {\n                      attempt += 1;\n                      try {\n                        await uploadBlobWithProgressXHR(presigned.uploadUrl, blob, selectedFile.mimeType || 'application/octet-stream', (percent) => {\n                          const partProgress = (percent / 100) * chunks[i].byteLength;\n                          const newPercent = Math.round(((uploadedBytes + partProgress) / (selectedFile.size || 1)) * 100);\n                          setProgress(newPercent);\n                        }, abortRef.current || undefined);\n                        uploadedParts.push({ partNumber, etag: 'etag-placeholder' });\n                        uploadedBytes += chunks[i].byteLength;\n                        uploaded = true;\n                      } catch (err) {\n                        console.log(`Part ${partNumber} attempt ${attempt} failed`, err);\n                        if (attempt >= UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) throw err;\n                        await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, attempt));\n                      }\n                    }\n                  }\n\n                  await completeMultipart({ uploadId, fileKey, parts: uploadedParts });\n                  await confirmUpload(fileKey, resourceId);\n                } else {\n                  const presign = await presignUrl(selectedFile.name || 'uploaded-file', selectedFile.mimeType || 'application/octet-stream', selectedFile.size || 0);\n                  const { uploadUrl, fileKey } = presign;\n                  const base64 = await FileSystem.readAsStringAsync(selectedFile.uri, { encoding: FileSystem.EncodingType.Base64 });\n                  const buffer = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));\n                  const blob = new Blob([buffer.buffer]);\n\n                  let attempt = 0;\n                  let uploaded = false;\n                  while (!uploaded && attempt < UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) {\n                    attempt += 1;\n                    try {\n                      await uploadBlobWithProgressXHR(uploadUrl, blob, selectedFile.mimeType || 'application/octet-stream', setProgress, abortRef.current || undefined);\n                      uploaded = true;\n                    } catch (err) {\n                      console.log(`Upload attempt ${attempt} failed`, err);\n                      if (attempt >= UPLOAD_CONFIG.MAX_UPLOAD_ATTEMPTS) throw err;\n                      await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, attempt));\n                    }\n                  }\n\n                  let confirmAttempt = 0;\n                  let confirmed = false;\n                  while (!confirmed && confirmAttempt < UPLOAD_CONFIG.MAX_CONFIRM_ATTEMPTS) {\n                    confirmAttempt += 1;\n                    try {\n                      await confirmUpload(fileKey, resourceId);\n                      confirmed = true;\n                    } catch (err) {\n                      console.log(`Confirm attempt ${confirmAttempt} failed`, err);\n                      if (confirmAttempt >= UPLOAD_CONFIG.MAX_CONFIRM_ATTEMPTS) throw err;\n                      await sleep(UPLOAD_CONFIG.BACKOFF_BASE_MS * Math.pow(2, confirmAttempt));\n                    }\n                  }\n                }\n\n                Alert.alert('Upload successful', 'Your file has been uploaded and linked to the resource.');\n                setTitle('');\n                setDescription('');\n                setSelectedFile(null);\n                setProgress(0);\n              } catch (error) {\n                console.log(error);\n                Alert.alert('Upload failed', 'Something went wrong while uploading. Please try again.');\n              } finally {\n                setUploading(false);\n                abortRef.current = null;\n              }\n            };\n\n            return (\n              <View style={styles.container}>\n                <Text style={styles.title}>Upload Resource</Text>\n                <TextInput placeholder=\"Title\" style={styles.input} value={title} onChangeText={setTitle} />\n                <TextInput placeholder=\"Description\" style={styles.input} value={description} multiline onChangeText={setDescription} />\n                <Button title={selectedFile ? `Selected: ${selectedFile.name}` : 'Select File'} onPress={handlePickFile} />\n                <View style={{ height: 12 }} />\n                {Platform.OS === 'android' ? (\n                  <>{uploading && <ProgressBarAndroid styleAttr=\"Horizontal\" indeterminate={false} progress={progress / 100} />}</>\n                ) : (\n                  <>{uploading && <ProgressViewIOS progress={progress / 100} />}</>\n                )}\n                <View style={{ height: 8 }} />\n                <Button title={uploading ? `Uploading... ${progress}%` : 'Upload Resource'} onPress={handleUpload} disabled={uploading} />\n                <View style={{ height: 8 }} />\n                {uploading && <Button title=\"Cancel Upload\" onPress={handleCancel} color=\"#d9534f\" />}\n                {uploading && <ActivityIndicator style={{ marginTop: 16 }} size=\"small\" />}\n              </View>\n            );\n          }\n\n          const styles = StyleSheet.create({\n            container: { flex: 1, padding: 12 },\n            title: { fontSize: 22, fontWeight: '700', marginBottom: 12 },\n            input: { borderWidth: 1, borderColor: '#ddd', padding: 12, marginBottom: 12, borderRadius: 6 },\n          });\n          EOF\n\n          cat > src/__tests__/chunk.test.ts <<'EOF'\n          import { splitArrayBufferIntoChunks } from '../utils/chunk';\n\n          test('splitArrayBufferIntoChunks splits buffer correctly', () => {\n            const size = 1024 * 1024;\n            const total = 5 * size + 123;\n            const buffer = new ArrayBuffer(total);\n            const chunks = splitArrayBufferIntoChunks(buffer, size);\n\n            expect(chunks.length).toBe(6);\n            let sum = 0;\n            for (const c of chunks) sum += c.byteLength;\n            expect(sum).toBe(total);\n          });\n          EOF\n\n          cat > .github/workflows/push-mobile-updates.yml <<'EOF'\n          name: Push Mobile App Updates\n\n          on:\n            workflow_dispatch:\n\n          jobs:\n            push-updates:\n              runs-on: ubuntu-latest\n              permissions:\n                contents: write\n\n              steps:\n                - name: Checkout repository\n                  uses: actions/checkout@v4\n                  with:\n                    fetch-depth: 0\n\n                - name: Setup Node\n                  uses: actions/setup-node@v4\n                  with:\n                    node-version: 18\n\n                - name: Install dependencies\n                  run: npm ci\n\n                - name: Run tests\n                  run: npm test -- --runInBand || true\n\n                - name: Commit and push changes\n                  env:\n                    GIT_TOKEN: ${{ secrets.PUSH_TOKEN }}\n                  run: |\n                    git config user.email \"ci@yourteam\"\n                    git config user.name \"ci-bot\"\n                    git remote set-url origin https://x-access-token:${GIT_TOKEN}@github.com/ReignnRule11/Sophia-Central-mobile.git\n                    git add .\n                    git commit -m \"chore: push mobile app updates\" || echo \"No changes to commit\"\n                    git push origin HEAD:main\n          EOF\n\n          cat > openapi.yaml <<'EOF'\n          openapi: 3.0.3\n          info:\n            title: Sophia Central Mobile API (extended)\n            version: '1.0.1'\n            description: Draft API contract for the mobile app including upload flows\n          servers:\n            - url: https://api.sophia-central.com\n          paths:\n            /auth/login:\n              post:\n                requestBody:\n                  required: true\n                  content:\n                    application/json:\n                      schema:\n                        type: object\n                        properties:\n                          email:\n                            type: string\n                          password:\n                            type: string\n                responses:\n                  '200':\n                    description: OK\n            /auth/refresh:\n              post:\n                requestBody:\n                  required: true\n                  content:\n                    application/json:\n                      schema:\n                        type: object\n                        properties:\n                          refresh_token:\n                            type: string\n                responses:\n                  '200':\n                    description: OK\n            /storage/initiate-multipart:\n              post:\n                description: Create a multipart upload and return presigned part URLs\n                responses:\n                  '200':\n                    description: OK\n            /storage/complete-multipart:\n              post:\n                description: Complete multipart upload using part etags\n                responses:\n                  '200':\n                    description: OK\n          EOF\n\n      - name: Commit and push changes\n        env:\n          GIT_TOKEN: ${{ secrets.PUSH_TOKEN }}\n        run: |\n          git config user.email \"ci@yourteam\"\n          git config user.name \"ci-bot\"\n          git remote set-url origin https://x-access-token:${GIT_TOKEN}@github.com/ReignnRule11/Sophia-Central-mobile.git\n          git add .\n          git commit -m \"chore: push mobile app updates\" || echo \"No changes to commit\"\n          git push origin HEAD:main\n```

