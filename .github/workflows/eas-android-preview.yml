name: Build Sophis Central Android Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview:
    name: Validate and build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install declared dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align packages with Expo SDK
        run: npx expo install --fix

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Verify Expo configuration and dependencies
        run: |
          npx expo config --type public
          npx expo-doctor

      - name: Build Android preview APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
