openapi: 3.0.3
info:
  title: Sophis Central Mobile API
  version: 1.1.0
  description: Mobile contract aligned with the current NestJS controllers and web frontend API.
servers:
  - url: https://sophia-central-backend.onrender.com
security:
  - sessionCookie: []
paths:
  /auth/csrf:
    get:
      security: []
      summary: Issue a CSRF token and CSRF cookie
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }
  /auth/signup:
    post:
      security: []
      summary: Register a user and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                institution: { type: string }
                faculty: { type: string }
                department: { type: string }
      responses:
        '201':
          description: User and CSRF token; access cookie is HttpOnly
  /auth/login:
    post:
      security: []
      summary: Authenticate and establish an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated user; access cookie is HttpOnly
  /auth/me:
    get:
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user
  /auth/logout:
    post:
      summary: Clear the authenticated session
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session cleared
  /resources:
    get:
      summary: List resources visible to the authenticated user
      responses:
        '200':
          description: Visible resources
    post:
      summary: Lecturer submits a resource for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title: { type: string }
                description: { type: string }
                type: { type: string, enum: [lecture_notes, past_question, research_paper, project, slides, other] }
                course: { type: string }
                topic: { type: string }
                institution: { type: string }
                level: { type: string }
                fileUrl: { type: string, format: uri }
      responses:
        '201':
          description: Resource submitted with pending moderation status
  /search:
    get:
      security: []
      summary: Search approved academic resources
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: course
          schema: { type: string }
        - in: query
          name: institution
          schema: { type: string }
        - in: query
          name: level
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
      responses:
        '200':
          description: Matching resources
  /resources/{id}/download:
    post:
      summary: Record an in-app download and grant reader access
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Download recorded
  /resources/{id}/file-url:
    get:
      summary: Obtain a short-lived authorized document URL
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed file URL
  /resources/{id}/save:
    post:
      summary: Save an approved resource
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Resource saved
    delete:
      summary: Remove a saved resource
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource unsaved
  /points/my-wallet/balance:
    get:
      summary: Get the current user's wallet balance
      responses:
        '200':
          description: Wallet balance
  /points/my-wallet/transactions:
    get:
      summary: Get the current user's transactions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Wallet transactions
  /ai/chat:
    post:
      summary: Ask Sophis AI (students only)
      parameters:
        - in: header
          name: X-CSRF-Token
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                sessionId: { type: string }
                resourceId: { type: string }
      responses:
        '200':
          description: Assistant response and Wisdom Points usage
  /storage/presigned-url:
    post:
      summary: Request a presigned document upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileSize, fileType, resourceId]
              properties:
                fileName: { type: string }
                fileSize: { type: integer, minimum: 1, maximum: 104857600 }
                fileType: { type: string }
                resourceId: { type: string }
      responses:
        '201':
          description: Presigned URL and upload identifier
  /storage/confirm-upload:
    post:
      summary: Confirm an uploaded document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, resourceId, fileName]
              properties:
                uploadId: { type: string }
                resourceId: { type: string }
                fileName: { type: string }
      responses:
        '201':
          description: Upload confirmation and file URL
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sophia_access_token
